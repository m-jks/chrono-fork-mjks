buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools:r8:8.3.37")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "${project(':background_fetch').projectDir}/libs" }
    }

    // Add this configuration block to force D8-compatible versions
    configurations.all {
        resolutionStrategy {
            force 'com.google.errorprone:error_prone_annotations:2.20.0'
            force 'androidx.lifecycle:lifecycle-livedata-core:2.8.3'
            force 'androidx.lifecycle:lifecycle-common:2.8.3'
            force 'androidx.lifecycle:lifecycle-common-java8:2.8.3'
            force 'androidx.lifecycle:lifecycle-runtime:2.8.3'
            force 'androidx.lifecycle:lifecycle-viewmodel:2.8.3'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

ext.kotlin_version = "1.8.0"

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}