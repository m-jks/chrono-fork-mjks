allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "${project(':background_fetch').projectDir}/libs" }
    }

    configurations.all {
        resolutionStrategy {
            // Fixes the tsbackgroundfetch D8 crash
            force 'com.google.errorprone:error_prone_annotations:2.20.0'
            
            // Fixes the lifecycle-livedata D8 crash
            force 'androidx.lifecycle:lifecycle-livedata-core:2.6.2'
            force 'androidx.lifecycle:lifecycle-common:2.6.2'
            force 'androidx.lifecycle:lifecycle-common-java8:2.6.2'
            force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
            force 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
            force 'androidx.core:core:1.10.1'
            force 'androidx.core:core-ktx:1.10.1'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// 1. Attach the afterEvaluate hooks in their OWN loop, before any project evaluates :app
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}

// 2. Trigger the evaluation dependency in a SEPARATE loop
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}